name: Build APK

on:
  push:
    branches: ["**"]
    # Mudança só de documentação ou de banco não é versão nova do app (evita atualização à toa na multimídia).
    paths-ignore: ["docs/**", "supabase/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.CIVIC_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Calcular a versão (nunca passa de 99 em nenhuma parte)
        run: |
          source versao.properties
          n=$(( ${{ github.run_number }} - RUN_BASE ))
          total=$(( MAIOR * 10000 + MENOR * 100 + PATCH + n ))
          if [ "$total" -gt 999999 ]; then echo "::error::A versão passou de 99.99.99"; exit 1; fi
          VERSAO="$(( total / 10000 )).$(( total / 100 % 100 )).$(( total % 100 ))"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          echo "Versão deste build: $VERSAO"

      - name: Compilar APK de teste (debug)
        run: ./gradlew assembleDebug --no-daemon -PversionCodeCI=${{ github.run_number }} -PversionNameCI=${{ env.VERSAO }}

      - name: Nomear o APK de teste
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/*.apk saida/Civic-Renatin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Civic-Renatin
          path: saida/Civic-Renatin.apk

      - name: Preparar chave de assinatura
        if: github.ref == 'refs/heads/main' && env.TEM_CHAVE == 'true'
        run: |
          echo "${{ secrets.CIVIC_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/civic.jks"
          echo "CIVIC_KEYSTORE=$RUNNER_TEMP/civic.jks" >> "$GITHUB_ENV"
          echo "CIVIC_KEYSTORE_PASSWORD=${{ secrets.CIVIC_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CIVIC_KEY_ALIAS=${{ secrets.CIVIC_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "CIVIC_KEY_PASSWORD=${{ secrets.CIVIC_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Compilar release assinado
        if: github.ref == 'refs/heads/main' && env.TEM_CHAVE == 'true'
        run: ./gradlew assembleRelease --no-daemon -PversionCodeCI=${{ github.run_number }} -PversionNameCI=${{ env.VERSAO }}

      - name: Publicar Release (o app lê esta Release para se atualizar)
        if: github.ref == 'refs/heads/main' && env.TEM_CHAVE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/Civic-Renatin.apk
          gh release create "build-${{ github.run_number }}" release/Civic-Renatin.apk \
            --title "${{ env.VERSAO }}" \
            --notes "Versão automática gerada a partir da main." --latest

      - name: Aviso quando falta a chave
        if: github.ref == 'refs/heads/main' && env.TEM_CHAVE != 'true'
        run: |
          echo "::warning::Segredo CIVIC_KEYSTORE_BASE64 nao configurado. Release NAO publicada (sem ela a atualizacao automatica nao funciona)."
